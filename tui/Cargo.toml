[package]
name = "miniepub-tui"
version = "0.2.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/SzilvasiPeter/miniepub"
description = "A minimal EPUB reader terminal user interface"
readme = "README.md"
keywords = ["epub", "tui", "ebook", "terminal"]
categories = ["command-line-interface"]

[dependencies]
miniepub = { path = "../core", version = "0.4.0" }
termimad = { version = "0.35.5", default-features = false }

[dev-dependencies]
assert_cmd = "2.2.2"

[lints]
workspace = true
